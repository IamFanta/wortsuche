<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Metin Clicker</title>

<style>
body{
    background:#0f0f18;
    color:white;
    font-family:Arial;
    text-align:center;
}

#metin{
    width:300px;
    cursor:pointer;
    margin-top:40px;
    transition:transform 0.05s;
}

#metin:active{
    transform:scale(0.9);
}

.bar{
    width:400px;
    height:25px;
    background:#333;
    margin:auto;
    border-radius:10px;
    overflow:hidden;
}

.hp{
    height:100%;
    background:#8a2be2;
    width:100%;
}

.damage{
    position:absolute;
    font-weight:bold;
    font-size:24px;
    pointer-events:none;
    animation:float 1s forwards;
}

.crit{
    color:yellow;
    font-size:30px;
}

@keyframes float{
    from{opacity:1; transform:translateY(0)}
    to{opacity:0; transform:translateY(-80px)}
}

</style>
</head>

<body>

<h1>Metin Clicker</h1>

<div class="bar">
<div class="hp" id="hpbar"></div>
</div>

<p id="hptext">300 / 300 HP</p>

<img id="metin" src="metin.png">

<h2>Zerstörte Metins: <span id="counter">0</span></h2>

<script>

let maxHP = 300
let hp = 300
let kills = 0

const metin = document.getElementById("metin")

metin.onclick = function(e){

    let dmg = Math.floor(Math.random()*11)+5
    let crit = Math.random() < 0.20

    if(crit){
        dmg *= 2
    }

    hp -= dmg

    showDamage(e.pageX, e.pageY, dmg, crit)

    if(hp <= 0){
        kills++
        document.getElementById("counter").innerText = kills
        hp = maxHP
    }

    updateHP()
}

function updateHP(){

    let percent = (hp/maxHP)*100

    document.getElementById("hpbar").style.width = percent + "%"
    document.getElementById("hptext").innerText = hp + " / " + maxHP + " HP"
}

function showDamage(x,y,dmg,crit){

    let div = document.createElement("div")
    div.className = "damage"

    if(crit){
        div.classList.add("crit")
        div.innerText = "KRIT -" + dmg
    }else{
        div.innerText = "-" + dmg
    }

    div.style.left = x + "px"
    div.style.top = y + "px"

    document.body.appendChild(div)

    setTimeout(()=>{
        div.remove()
    },1000)
}

</script>

</body>
</html>
